project:
  name: "ecg-fpga-accelerator"
  seed: 42
  output_dir: "software/outputs"
  log_dir: "software/outputs/logs"

data:
  raw_dir: "software/data/raw"
  processed_dir: "software/data/processed"
  physionet_db: "mitdb"
  sample_rate: 360
  window_size: 256
  lead_index: 0

  # Inter-patient split following Chazal et al. 2004 (AAMI standard).
  # Records are split at the PATIENT level — this prevents data leakage.
  train_records:
    - "100"
    - "101"
    - "103"
    - "105"
    - "106"
    - "108"
    - "109"
    - "111"
    - "112"
    - "113"
    - "114"
    - "115"
    - "116"
    - "117"
    - "118"
    - "119"
    - "121"
    - "122"
    - "123"
    - "124"
    - "200"
    - "201"
    - "202"
    - "203"
    - "205"
    - "207"
    - "208"
    - "209"
    - "210"
    - "212"
    - "213"
    - "214"
    - "215"
    - "219"
    - "220"
    - "221"
    - "222"
    - "223"
    - "228"
    - "230"
    - "231"
    - "233"
    - "234"

  test_records:
    - "104"
    - "107"
    - "217"
    - "232"

  val_split_fraction: 0.15

  # CLINICAL DECISION: annotation_map defines what counts as each cardiac condition.
  # MIT-BIH annotation symbols -> project class.
  # ST_segment: 'S'=ST-change, 'J'=junctional (J-point elevation)
  # QT_interval: 'f'=fusion beat (QT morphology distorted), 'Q'/'q'=unclassifiable
  # P_wave: atrial ectopics ('A'=atrial premature, 'a'=aberrant atrial,
  #         'e'=atrial escape, 'j'=nodal escape)
  # Bundle_Branch_Block: 'B'=BBB, 'L'=LBBB, 'R'=RBBB, 'r'=R-on-T
  # Normal: 'N'=normal sinus, '.'=non-conducted paced beat
  annotation_map:
    ST_segment:          ["S", "J"]
    QT_interval:         ["f", "Q", "q"]
    P_wave:              ["A", "a", "e", "j"]
    Bundle_Branch_Block: ["B", "L", "R", "r"]
    Normal:              ["N", "."]

  # IMMUTABLE class order. Hardware RTL is built around this. Never change.
  # [0]=ST_segment [1]=QT_interval [2]=P_wave [3]=Bundle_Branch_Block [4]=Normal
  class_names:
    - "ST_segment"
    - "QT_interval"
    - "P_wave"
    - "Bundle_Branch_Block"
    - "Normal"

model:
  branch_out_channels: 32
  kernel_sizes: [3, 5, 7]
  pool_output_size: 64
  fc_hidden_size: 128
  dropout_rate: 0.3
  num_classes: 5
  # Clinical severity weights: higher = rarer/more dangerous condition.
  # ST(3.0)=ischemia, QT(3.5)=sudden death risk, P_wave(2.5)=pre-AF,
  # BBB(2.0)=conduction disease, Normal(1.0)=baseline
  class_weights: [3.0, 3.5, 2.5, 2.0, 1.0]

training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 0.0001
  checkpoint_every_n_epochs: 5
  early_stopping_patience: 10
  num_workers: 4
  pin_memory: true

qat:
  epochs: 20
  lr: 0.0001
  batch_size: 64
  calibration_batches: 100
  weight_bits: 8
  activation_bits: 8
  max_sensitivity_drop_pct: 2.0

export:
  output_dir: "software/outputs/mem_files"

inference:
  simulation_mode: true
  threshold: 0.5
  window_size: 256
